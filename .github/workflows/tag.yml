name: Create Plugin Release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  test:
    name: Tests and Static Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordpress
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer, cs2pr
          extensions: zip, simplexml

      - name: Update environment config for GitHub Actions
        env:
          PLUGIN_SLUG: ${{ github.event.repository.name }}
        run: |
          find . -depth \( -name '.env.testing' \) -exec sed -i "s/TEST_SITE_DB_HOST=\"127.0.0.1\"/TEST_SITE_DB_HOST=\"127.0.0.1:${{ job.services.mysql.ports['3306'] }}\"/g" {} +
          find . -depth \( -name '.env.testing' -o -name '*.cest' \) -exec sed -i "s/localhost:8080\/${{ env.PLUGIN_SLUG }}/localhost:8080/g" {} +
          find . -depth \( -name 'dump.sql' \) -exec sed -i "s/localhost:8080\/${{ env.PLUGIN_SLUG }}/localhost:8080/g" {} +

      - name: Read .env.testing
        uses: c-py/action-dotenv-to-setenv@v2
        with:
          env-file: .env.testing

      - name: Configure MySQL
        run: |
          mysql -h 127.0.0.1 --port ${{ job.services.mysql.ports['3306'] }} -u root -ppassword -e "CREATE USER '"$TEST_DB_USER"'@'%' IDENTIFIED WITH mysql_native_password BY '"$TEST_DB_PASSWORD"';";

      - name: Run composer install
        continue-on-error: true
        run: composer install  --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan to add annotations to the code
        run: vendor/bin/phpstan analyse -c phpstan.neon --memory-limit 1G --no-progress --error-format=checkstyle | cs2pr

      - name: Run PhpUnit
        run: vendor/bin/phpunit -c phpunit.xml.dist

      - name: Remove vendor
        run: rm -r vendor

      - name: Run composer install without dev
        continue-on-error: true
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Update tag version in all files
        run: |
          TAG=${{ github.ref_name }}
          NEW_VER=${TAG:1}
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VER\"/" package.json
          sed -i "s/Stable tag: [^ ]*/Stable tag: $NEW_VER/" readme.txt
          sed -i "s/public const SINEFINE_PROMIMPORT_VERSION = '[^']*';/public const SINEFINE_PROMIMPORT_VERSION = '$NEW_VER';/" src/Plugin.php
          sed -i "s/\* @version[[:space:]]\{1,\}[^ ]*/\* @version           $NEW_VER/" spss12-import-prom-woo.php
          sed -i "s/Version:[[:space:]]\{1,\}[^ ]*/Version:           $NEW_VER/" spss12-import-prom-woo.php
          echo "Version updated to $NEW_VER in all files."

      - name: Build and zip plugin
        run: |
          mkdir -p build/
          zip -r build/spss12-import-prom-woo.zip . -x "cache/*" "node_modules/*" "tests/*" "docs/*" ".pnpm-store/*" ".git/*" ".github/*" "build/*" ".idea/*" ".gitignore" "composer.json" "composer.lock" "phpunit.xml.dist" "phpstan.neon" "rector.php" "phpcs.xml.dist" "psalm.xml" "infection.json5" "webpack.config.js" "package.json" "pnpm-lock.yaml" "pnpm-workspace.yaml" "*.zip" "*.phar" "*.sh"

      - name: Upload Plugin artifact
        id: upload_artifact_step
        uses: actions/upload-artifact@v6
        with:
          name: spss12-import-prom-woo
          path: build/spss12-import-prom-woo.zip

  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: test
    steps:
      - name: Generate Changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v7
        with:
          name: spss12-import-prom-woo
          path: build

      - name: Creating Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref }}
          name: Release ${{ env.GITHUB_REF_SLUG }}
          body: ${{ steps.changelog.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "build/spss12-import-prom-woo.zip"

  deploy:
    needs: test
    name: Deploy to SVN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: spss12-import-prom-woo
          path: build

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Deploy to WordPress.org SVN
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SVN_URL="https://plugins.svn.wordpress.org/spss12-import-prom-woo/"

          # Extract zip artifact
          mkdir -p extracted
          unzip build/spss12-import-prom-woo.zip -d extracted/

          # Checkout SVN
          svn checkout --depth immediates "$SVN_URL" svn
          svn update --set-depth infinity svn/trunk

          # Deploy extracted plugin to trunk
          rsync -av --delete --checksum extracted/ svn/trunk/

          cd svn

          # Add new files
          svn add trunk/* --force 2>/dev/null || true

          # Remove deleted files
          svn status trunk/ | grep '^!' | awk '{print $2}' | xargs -r svn del --force 2>/dev/null || true

          # Tag the release
          if svn ls "tags/$TAG" 2>/dev/null; then
            svn rm "tags/$TAG"
          fi
          svn copy trunk "tags/$TAG"

          svn commit -m "Release $GITHUB_REF_NAME" --username "$SVN_USERNAME" --password "$SVN_PASSWORD"